name: Robo Diario CinePro TV

on:
  schedule:
    # Roda todo dia as 04:37 da manha (horario de Brasilia = 07:37 UTC, fora do pico mundial das :00)
    - cron: '37 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auditar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rodar auditoria de canais e regerar site
        run: python -W error ECOSSISTEMA_STREAMING_IPTV/manutencao_diaria_github.py

      - name: Publicar atualizacao no GitHub Pages
        run: |
          git config user.name "Robo CinePro TV"
          git config user.email "actions@users.noreply.github.com"
          git add ECOSSISTEMA_STREAMING_IPTV/canais_comunidade_br.json ECOSSISTEMA_STREAMING_IPTV/saida/canais_leves.json ECOSSISTEMA_STREAMING_IPTV/saida/canais.json ECOSSISTEMA_STREAMING_IPTV/saida/epg_br.json ECOSSISTEMA_STREAMING_IPTV/saida/banco_iptv.db docs/index.html docs/canais.json docs/epg_br.json ECOSSISTEMA_STREAMING_IPTV/saida/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore(robo): atualizacao diaria automatica dos canais ao vivo"
            git push
          else
            echo "Nenhuma alteracao necessaria hoje."
          fi
