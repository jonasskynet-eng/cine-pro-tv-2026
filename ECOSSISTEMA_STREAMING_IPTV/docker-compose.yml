services:
  cinepro-vip:
    build: ..
    container_name: cinepro_tv_vip
    restart: unless-stopped
    ports:
      - "80:8090"
      - "8090:8090"
    environment:
      - TZ=America/Sao_Paulo
      - PORT=8090
      - CINEPRO_MODO=VIP_DOCKER
      - CINEPRO_VIP_TOKEN=${CINEPRO_VIP_TOKEN:-}
      - VIP_M3U_URL=${VIP_M3U_URL:-}
    volumes:
      - ../docs:/app/docs:ro
      - ./vip_privado:/app/vip_privado
