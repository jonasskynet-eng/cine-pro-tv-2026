<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#060913">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Controle Remoto TV Pro</title>
    <style>
        :root {
            --bg-base: #060913;
            --bg-surface: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #334155;
            --primary: #3b82f6;
            --emerald: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 14px 12px 30px;
        }

        /* BARRA SUPERIOR */
        .remote-header {
            width: 100%;
            max-width: 380px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .remote-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .conn-pill {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 12px;
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.35);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .conn-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--emerald);
            box-shadow: 0 0 6px var(--emerald);
        }

        /* DISPLAY DO CANAL ATUAL NA TV */
        .tv-card-display {
            width: 100%;
            max-width: 380px;
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .tv-ch-num {
            font-size: 20px;
            font-weight: 900;
            color: #6ee7b7;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 4px 10px;
            border-radius: 8px;
            font-family: monospace;
        }
        .tv-meta {
            flex: 1;
            overflow: hidden;
        }
        .tv-label-live {
            font-size: 9px;
            font-weight: 800;
            color: var(--amber);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .tv-name {
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        /* D-PAD / BOTÕES DIRECIONAIS */
        .dpad-container {
            width: 220px;
            height: 220px;
            position: relative;
            margin: 10px 0 18px;
        }
        .dpad-outer {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--bg-surface);
            border: 2px solid var(--border);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), inset 0 2px 4px rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .dpad-btn {
            position: absolute;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 800;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
        }
        .dpad-btn:active {
            color: var(--emerald);
            transform: scale(0.92);
        }
        .dpad-up    { top: 12px; width: 80px; height: 50px; }
        .dpad-down  { bottom: 12px; width: 80px; height: 50px; }
        .dpad-left  { left: 12px; width: 50px; height: 80px; }
        .dpad-right { right: 12px; width: 50px; height: 80px; }
        .dpad-center {
            width: 82px;
            height: 82px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .dpad-center:active {
            background: var(--emerald);
            color: #000;
            transform: scale(0.94);
        }

        /* LINHA DE BOTÕES DE AÇÃO */
        .actions-row {
            width: 100%;
            max-width: 360px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 16px;
        }
        .act-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 6px;
            color: var(--text-main);
            font-size: 11px;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .act-btn span.icon {
            font-size: 18px;
        }
        .act-btn:active {
            background: var(--bg-card-hover);
            border-color: var(--emerald);
            transform: scale(0.95);
        }

        /* TECLADO NUMÉRICO */
        .numpad-title {
            width: 100%;
            max-width: 360px;
            font-size: 11px;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin: 4px 0 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .num-display {
            font-family: monospace;
            font-size: 13px;
            color: #6ee7b7;
            background: rgba(16, 185, 129, 0.1);
            padding: 1px 8px;
            border-radius: 4px;
        }
        .numpad-grid {
            width: 100%;
            max-width: 360px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 18px;
        }
        .num-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 0;
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.12s;
        }
        .num-btn:active {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--emerald);
            transform: scale(0.94);
        }
        .num-btn.btn-clear {
            font-size: 12px;
            color: var(--rose);
            font-weight: 800;
        }
        .num-btn.btn-send {
            font-size: 12px;
            color: #6ee7b7;
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.35);
        }

        /* ATALHOS RÁPIDOS DE CATEGORIAS */
        .cat-shortcuts {
            width: 100%;
            max-width: 360px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
        }
        .cat-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
        }
        .cat-btn:active {
            background: var(--emerald);
            color: #000;
        }

        /* HUD NOTIFICAÇÃO */
        .toast {
            position: fixed;
            bottom: 20px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--emerald);
            color: #6ee7b7;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.25s ease;
            pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            z-index: 100;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    
        /* BOTÃO PROEMINENTE DE TELA TODA NO CELULAR */
        .btn-expand-full {
            width: 100%;
            max-width: 360px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(6, 182, 212, 0.2) 100%);
            border: 1.5px solid rgba(16, 185, 129, 0.55);
            border-radius: 14px;
            padding: 13px 16px;
            color: #6ee7b7;
            font-size: 13px;
            font-weight: 900;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), 0 0 12px rgba(16, 185, 129, 0.2);
            transition: all 0.15s;
        }
        .btn-expand-full:active {
            background: var(--emerald);
            color: #060913;
            transform: scale(0.96);
        }
        .tv-epg-box {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.3;
        }
        .tv-epg-now {
            color: #fca5a5;
            font-weight: 700;
        }
        .tv-epg-next {
            color: #fde68a;
            font-weight: 600;
        }
    
    </style>
</head>
<body>

    <div class="remote-header">
        <div class="remote-title">
            <span>📺</span> CENTRAL TV PRO
        </div>
        <div class="conn-pill">
            <span class="conn-dot"></span>
            <span id="connLabel">Wi-Fi Conectado</span>
        </div>
    </div>

    <!-- DISPLAY DO CANAL ATUAL DA TV -->
    <div class="tv-card-display">
        <div class="tv-ch-num" id="tvCurNum">#001</div>
        <div class="tv-meta">
            <div class="tv-label-live">Ao Vivo na TV</div>
            <div class="tv-name" id="tvCurName">Sintonizando...</div>
            <div class="tv-epg-box">
                <div id="tvCurEpgNow" class="tv-epg-now">🔴 Carregando guia...</div>
                <div id="tvCurEpgNext" class="tv-epg-next">⏳ A seguir: ...</div>
            </div>
        </div>
    </div>

    <!-- BOTÃO PROEMINENTE TELA CHEIA + VOZ -->
    <div style="display:flex; gap:8px; width:100%; max-width:380px; margin-bottom:14px;">
        <button class="btn-expand-full" style="margin-bottom:0; flex:1;" onclick="enviarComando('fullscreen')">
            <span style="font-size:18px;">⛶</span>
            <span>TELA TODA</span>
        </button>
        <button class="btn-expand-full" id="btnVozRemoto" style="margin-bottom:0; flex:1; background:linear-gradient(135deg, rgba(16,185,129,0.22), rgba(6,182,212,0.18)); border-color:rgba(16,185,129,0.55); color:#d1fae5;" onclick="ativarComandoVoz()">
            <span style="font-size:18px;">🎙️</span>
            <span id="vozRemotoLabel">FALAR CANAL</span>
        </button>
    </div>

    <!-- D-PAD DE NAVEGAÇÃO -->
    <div class="dpad-container">
        <div class="dpad-outer">
            <button class="dpad-btn dpad-up" onclick="enviarComando('proximo')">
                <span>▲</span>
                <span style="font-size:9px;">CH +</span>
            </button>
            <button class="dpad-btn dpad-down" onclick="enviarComando('anterior')">
                <span style="font-size:9px;">CH -</span>
                <span>▼</span>
            </button>
            <button class="dpad-btn dpad-left" onclick="enviarComando('volume_down')">
                <span>◄ VOL</span>
            </button>
            <button class="dpad-btn dpad-right" onclick="enviarComando('volume_up')">
                <span>VOL ►</span>
            </button>
            <button class="dpad-center" onclick="enviarComando('playpause')">
                OK
            </button>
        </div>
    </div>

    <!-- AÇÕES RÁPIDAS -->
    <div class="actions-row">
        <button class="act-btn" onclick="enviarComando('voltar')">
            <span class="icon">↩️</span>
            <span>Voltar</span>
        </button>
        <button class="act-btn" onclick="enviarComando('mute')">
            <span class="icon">🔇</span>
            <span>Mudo</span>
        </button>
        <button class="act-btn" onclick="enviarComando('audio_only')">
            <span class="icon">📻</span>
            <span>Só Áudio</span>
        </button>
        <button class="act-btn" onclick="enviarComando('dormir30')">
            <span class="icon">🌙</span>
            <span>Dormir 30m</span>
        </button>
        <button class="act-btn" onclick="enviarComando('playpause')">
            <span class="icon">⏯</span>
            <span>Play/Pause</span>
        </button>
        <button class="act-btn" onclick="enviarComando('aspect')">
            <span class="icon">📐</span>
            <span>16:9 Tela</span>
        </button>
        <button class="act-btn" onclick="enviarComando('cinema')">
            <span class="icon">🎬</span>
            <span>Cinema</span>
        </button>
    </div>

    <!-- TECLADO NUMÉRICO -->
    <div class="numpad-title">
        <span>Sintonizador Numérico</span>
        <span class="num-display" id="numInputDisplay">Dígito: --</span>
    </div>

    <div class="numpad-grid">
        <button class="num-btn" onclick="teclarNumero('1')">1</button>
        <button class="num-btn" onclick="teclarNumero('2')">2</button>
        <button class="num-btn" onclick="teclarNumero('3')">3</button>
        <button class="num-btn" onclick="teclarNumero('4')">4</button>
        <button class="num-btn" onclick="teclarNumero('5')">5</button>
        <button class="num-btn" onclick="teclarNumero('6')">6</button>
        <button class="num-btn" onclick="teclarNumero('7')">7</button>
        <button class="num-btn" onclick="teclarNumero('8')">8</button>
        <button class="num-btn" onclick="teclarNumero('9')">9</button>
        <button class="num-btn btn-clear" onclick="limparNumero()">LIMPAR</button>
        <button class="num-btn" onclick="teclarNumero('0')">0</button>
        <button class="num-btn btn-send" onclick="enviarNumero()">IR ➔</button>
    </div>

    <!-- ATALHOS DE CATEGORIA (ORDEM DOS GOSTOS DO JONAS) -->
    <div class="cat-shortcuts">
        <button class="cat-btn" onclick="enviarComando('categoria', 'aberta')">📺 TV Aberta</button>
        <button class="cat-btn" onclick="enviarComando('categoria', 'discovery')">🔬 Discovery</button>
        <button class="cat-btn" onclick="enviarComando('categoria', 'filmes')">🎬 Filmes</button>
        <button class="cat-btn" onclick="enviarComando('categoria', 'series')">🍿 Séries</button>
        <button class="cat-btn" onclick="enviarComando('categoria', 'esportes')">⚽ Esportes</button>
        <button class="cat-btn" onclick="enviarComando('categoria', 'noticias')">📰 Notícias</button>
        <button class="cat-btn" onclick="enviarComando('categoria', 'infantil')">🧸 Desenhos</button>
        <button class="cat-btn" onclick="enviarComando('categoria', 'musica')">📻 Rádios</button>
        <button class="cat-btn" onclick="enviarComando('categoria', 'religiosos')">⛪ Religiosos</button>
    </div>

    <div id="toastHUD" class="toast">Comando enviado!</div>

    <script>
        let bufferNum = '';
        let timerNum = null;

        function vibrar() {
            if (navigator.vibrate) navigator.vibrate(25);
        }

        function mostrarAviso(msg) {
            const toast = document.getElementById('toastHUD');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1800);
        }

        async function enviarComando(cmd, val = '') {
            vibrar();
            try {
                const resp = await fetch(`/api/comando?cmd=${encodeURIComponent(cmd)}&val=${encodeURIComponent(val)}`);
                if (resp.ok) {
                    mostrarAviso(`⚡ ${cmd.toUpperCase()} enviado à TV`);
                }
            } catch (err) {
                mostrarAviso('⚠️ Falha ao conectar à TV');
            }
        }

        function teclarNumero(digito) {
            vibrar();
            clearTimeout(timerNum);
            bufferNum += digito;
            if (bufferNum.length > 4) bufferNum = digito;
            document.getElementById('numInputDisplay').textContent = `Canal: #${bufferNum}`;

            timerNum = setTimeout(() => {
                enviarNumero();
            }, 1800);
        }

        function limparNumero() {
            vibrar();
            clearTimeout(timerNum);
            bufferNum = '';
            document.getElementById('numInputDisplay').textContent = 'Dígito: --';
            mostrarAviso('✖ Número limpo');
        }

        function enviarNumero() {
            clearTimeout(timerNum);
            if (!bufferNum) return;
            const num = parseInt(bufferNum, 10);
            enviarComando('sintonizar', num);
            mostrarAviso(`🔢 Sintonizando CH #${num}...`);
            bufferNum = '';
            document.getElementById('numInputDisplay').textContent = 'Dígito: --';
        }

        // Atualizar status da TV em tempo real (Polling suave a cada 2s)
        async function atualizarStatusTV() {
            try {
                const resp = await fetch('/api/obter_status_tv');
                if (resp.ok) {
                    const data = await resp.json();
                    if (data.canal_numero) {
                        document.getElementById('tvCurNum').textContent = `#${String(data.canal_numero).padStart(3, '0')}`;
                    }
                    if (data.canal_nome) {
                        document.getElementById('tvCurName').textContent = data.canal_nome;
                    }
                    document.getElementById('connLabel').textContent = 'Wi-Fi Conectado';
                    if (data.epg_atual) {
                        document.getElementById('tvCurEpgNow').textContent = '🔴 No Ar: ' + data.epg_atual;
                    }
                    if (data.epg_proximo) {
                        document.getElementById('tvCurEpgNext').textContent = '⏳ A Seguir: ' + data.epg_proximo;
                    }
                }
            } catch (err) {
                document.getElementById('connLabel').textContent = 'Offline';
            }
        }

        function ativarComandoVoz() {
            vibrar();
            const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
            const lbl = document.getElementById('vozRemotoLabel');
            if (!Rec) {
                const manual = prompt('Seu navegador não liberou microfone aqui. Digite o nome do canal:');
                if (manual && manual.trim()) enviarComando('voz', manual.trim());
                return;
            }
            const rec = new Rec();
            rec.lang = 'pt-BR';
            rec.interimResults = false;
            rec.maxAlternatives = 1;
            if (lbl) lbl.textContent = 'OUVINDO...';
            mostrarAviso('🎙️ Pode falar o canal ou comando...');
            rec.onresult = (ev) => {
                const fala = ((ev.results && ev.results[0] && ev.results[0][0] && ev.results[0][0].transcript) || '').trim();
                if (lbl) lbl.textContent = 'FALAR CANAL';
                if (!fala) return;
                const f = fala.toLowerCase();
                if (f.includes('próximo') || f.includes('proximo')) return enviarComando('proximo');
                if (f.includes('anterior') || f.includes('voltar')) return enviarComando('voltar');
                if (f.includes('mudo') || f.includes('silêncio') || f.includes('silencio')) return enviarComando('mute');
                if (f.includes('tela cheia') || f.includes('tela toda')) return enviarComando('fullscreen');
                if (f.includes('só áudio') || f.includes('so audio')) return enviarComando('audio_only');
                const mNum = f.match(/canal\s*(\d+)/);
                if (mNum) return enviarComando('sintonizar', parseInt(mNum[1], 10));
                enviarComando('voz', fala);
                mostrarAviso(`🎙️ "${fala}" enviado!`);
            };
            rec.onerror = () => {
                if (lbl) lbl.textContent = 'FALAR CANAL';
                mostrarAviso('⚠️ Não entendi ou microfone bloqueado');
            };
            rec.onend = () => {
                if (lbl) lbl.textContent = 'FALAR CANAL';
            };
            try { rec.start(); } catch (_) {
                if (lbl) lbl.textContent = 'FALAR CANAL';
            }
        }

        setInterval(atualizarStatusTV, 2000);
        atualizarStatusTV();
    </script>
</body>
</html>
