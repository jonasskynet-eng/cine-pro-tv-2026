services:
  - type: web
    name: cinepro-tv-vip
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: CINEPRO_MODO
        value: VIP_DOCKER
      - key: PORT
        value: "8090"
      - key: CINEPRO_ADMIN_PIN
        generateValue: true
      - key: CINEPRO_CLOUD_SYNC_URL
        sync: false
      - key: CINEPRO_CLOUD_SYNC_TOKEN
        sync: false
      - key: PIX_WEBHOOK_SECRET
        sync: false
      - key: VIP_M3U_URL
        sync: false
